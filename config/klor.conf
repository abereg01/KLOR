# User-level overrides for KLOR.
#
# 2026-05-22: emptied this file as part of the prospector merge.
# Settings previously here applied globally to whatever ZMK was building,
# which broke the dongle (CONFIG_ZMK_DISPLAY=n was forcing display off in
# the dongle build too, even though the dongle has a display via prospector_adapter).
#
# All halves-specific settings now live in config/boards/shields/klor/klor.conf
# (encoders, display off, underglow off, pointing). Dongle-specific settings
# live in config/boards/shields/klor_dongle/klor_dongle.conf. Add new
# overrides here only if they should apply to EVERY firmware target this
# repo builds (halves + dongle + settings_reset).
