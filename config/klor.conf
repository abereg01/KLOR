# Uncomment these two line to add support for encoders to your firmware
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# Uncomment the following line to enable the KLOR OLED Display
CONFIG_ZMK_DISPLAY=n

# Uncomment the following lines to enable per key RGB.
# CONFIG_WS2812_STRIP was removed in ZMK main (Zephyr 4.1) — the driver is now
# selected automatically by the devicetree `worldsemi,ws2812-spi` node in
# config/boards/shields/klor/boards/nice_nano.overlay. Setting it explicitly
# (even to =n) aborts the build on an "undefined symbol" Kconfig warning.
CONFIG_ZMK_RGB_UNDERGLOW=n

#CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=40

# Enable ZMK pointing (mouse/scroll) — required for &msc horizontal scroll on encoder
CONFIG_ZMK_POINTING=y