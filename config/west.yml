manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
  projects:
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
  self:
    path: config

# Notes
# -----
# - urob/zmk-auto-layer was dropped on 2026-05-22 when this repo moved from
#   ZMK v0.3 to ZMK main (no main-compatible release exists). The single use
#   site (td_nav_num) was reworked to `<&tog NAV>, <&tog NUM>`.
# - The dongle build target lives in this repo as of 2026-05-22, using the
#   klor_dongle shield in config/boards/shields/klor_dongle/.
# - On 2026-05-23 the prospector ZMK module (display driver, ST7789V
#   amendment, event types, fonts, KLOR-aesthetic operator layout) was
#   absorbed into this repo as the klor_dongle_screen shield and the
#   top-level module (see zephyr/module.yml + CMakeLists.txt + Kconfig at
#   the repo root). The abereg01/prospector entry that previously lived
#   here is gone — the build no longer depends on that external repo.
#   See memory: prospector_absorbed_into_klor.md.
