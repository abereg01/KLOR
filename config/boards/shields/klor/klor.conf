# Shield-level config for the KLOR halves shield.
# These apply ONLY when building klor_left or klor_right — never for the
# dongle, which uses a different shield (klor_dongle + klor_dongle_screen).
#
# Anything in here that should ALSO apply to the dongle has to be replicated
# in config/boards/shields/klor_dongle/klor_dongle.conf.

# Encoders (one on each half)
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# OLED display: the halves have no display attached. The status screen / KLOR
# wordmark / WPM widgets all live on the dongle's larger display (klor_dongle_screen shield).
CONFIG_ZMK_DISPLAY=n

# Per-key RGB underglow: hardware is present but Andreas keeps it off.
# (CONFIG_WS2812_STRIP was removed in Zephyr 4.1 — the WS2812-SPI driver is
# now selected automatically by the worldsemi,ws2812-spi DT node in
# boards/<board>.overlay, so there's no Kconfig switch to set here.)
CONFIG_ZMK_RGB_UNDERGLOW=n

# Mouse / scroll support: required for the &msc SCRL_LEFT / SCRL_RIGHT
# bindings used by the encoder sensor-rotate behavior in the keymap.
CONFIG_ZMK_POINTING=y
