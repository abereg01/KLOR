# Single-repo build matrix as of 2026-05-22 (after prospector merge).
# This repo now produces all four firmware artifacts:
#   - klor_left / klor_right     → halves (peripherals)
#   - klor_dongle prospector_adapter → dongle (central, with Saturn display)
#   - settings_reset             → bond-wipe utility, flashed once per device
#                                  when changing central or otherwise resetting BLE
#
# Example syntax (for reference, unused):
#
#   board: [ "nice_nano//zmk" ]
#   shield: [ "corne_left", "corne_right" ]
#   include:
#     - board: bdn9_rev2

include:
  # ── Halves (nice_nano, ZMK split peripherals) ────────────────────────────
  - board: nice_nano//zmk
    shield: klor_left
  - board: nice_nano//zmk
    shield: klor_right

  # ── Dongle (xiao_ble, ZMK split central + Saturn display) ────────────────
  # The dongle is the BLE central and the device that talks HID to the host.
  # Combined shield: klor_dongle (keyless input stubs) + prospector_adapter
  # (display hardware and the KLOR-aesthetic operator layout).
  - board: xiao_ble//zmk
    shield: klor_dongle prospector_adapter

  # ── settings_reset (both boards) ─────────────────────────────────────────
  # Flash this once on a device to wipe stale BLE bonds (e.g. when changing
  # the split central). Boot once, then reflash the normal image.
  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
