# Single-repo build matrix.
# After the 2026-05-23 prospector absorption, this repo is the SOLE source for
# every firmware artifact (no abereg01/prospector dependency in west.yml):
#   - klor_left / klor_right       → halves (peripherals)
#   - klor_dongle klor_dongle_screen → dongle (central, with Saturn display)
#   - settings_reset               → bond-wipe utility, flashed once per device
#                                    when changing central or resetting BLE
#
# Example syntax (for reference, unused):
#
#   board: [ "nice_nano//zmk" ]
#   shield: [ "corne_left", "corne_right" ]
#   include:
#     - board: bdn9_rev2

include:
  # ── Halves (nice_nano, ZMK split peripherals) ────────────────────────────
  - board: nice_nano//zmk
    shield: klor_left
  - board: nice_nano//zmk
    shield: klor_right

  # ── Dongle (xiao_ble, ZMK split central + Saturn display) ────────────────
  # The dongle is the BLE central and the device that talks HID to the host.
  # Combined shield: klor_dongle (keyless input stubs) + klor_dongle_screen
  # (display hardware and the KLOR-aesthetic operator layout).
  # klor_dongle_screen is the renamed/absorbed prospector_adapter — same
  # files, klor-prefixed identity. See prospector_absorbed_into_klor.md.
  - board: xiao_ble//zmk
    shield: klor_dongle klor_dongle_screen

  # ── settings_reset (both boards) ─────────────────────────────────────────
  # Flash this once on a device to wipe stale BLE bonds (e.g. when changing
  # the split central). Boot once, then reflash the normal image.
  - board: nice_nano//zmk
    shield: settings_reset
  - board: xiao_ble//zmk
    shield: settings_reset
