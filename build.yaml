# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#

include:
  # Both halves are peripherals. The central is the Prospector dongle,
  # built from the separate `prospector` repo (xiao_ble + klor_dongle +
  # prospector_adapter shield). See: prospector/build.yaml.
  - board: nice_nano_v2
    shield: klor_left
  - board: nice_nano_v2
    shield: klor_right
  # Flash this once on each half to wipe stale BLE bonds (e.g. when changing
  # central from "left half" to "Prospector dongle"). Boot once, then reflash
  # the normal klor_left / klor_right image.
  - board: nice_nano_v2
    shield: settings_reset
